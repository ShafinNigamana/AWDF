name: CI Pipeline

on:
  push:
    branches:
      - main
      - practical-*
      - ci/*
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Practicals/Student-Portfolio

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Practicals/Student-Portfolio/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Oxlint Linter
        run: npm run lint

      - name: Build Frontend Application
        run: npm run build

  backend:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Practicals/Task-Manager-Backend

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Practicals/Task-Manager-Backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Run Backend Automated Tests
        run: npm test
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/task_manager
          PORT: 5000
          JWT_SECRET: your_secure_secret_here
          CACHE_TTL: 60
          SIMULATE_SLOW_NOTIFICATION: true
